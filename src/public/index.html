<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>file upload</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        display: flex;
        height: max-content;
        flex-direction: column;
        min-height: 100vh;
        justify-items: center;
        justify-content: center;
        align-items: center;

        /* background-color: antiquewhite; */
      }
      form {
        width: min(100%, 400px);
        display: flex;
        flex-direction: column;

        /* justify-content: center; */
        padding: 32px;
        padding-top: 40px;
        gap: 16px;
        align-content: center;
        height: 400px;
        box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.15);
      }
      form input {
        border: 2px dotted black;
        padding: 8px;
        border-radius: 8px;
      }
      form button {
        padding: 8px;
        background-color: #24a0ed;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 8px;
      }
      .progress-container {
        width: 100%;
        background-color: #eee;
        border-radius: 10px;
        height: 20px;
      }
      .progress-bar {
        width: 0%;
        height: 100%;
        background-color: #4caf50;
        border-radius: 10px;
        text-align: center;
        color: white;
        font-size: 12px;
        line-height: 20px;
      }
    </style>
  </head>
  <body>
    <form onsubmit="onSubmit.call(this, event)">
      <h1>File Upload</h1>
      <input type="file" name="file" />
      <div class="progress-container">
        <div class="progress-bar">0%</div>
      </div>
      <button type="submit">Upload</button>
    </form>

    <script>
      async function onSubmit(event) {
        event.preventDefault();
        const file = this.file.files[0];
        if (!file) {
          alert("Please select a file to upload.");
          return;
        }
        try {
          await uploadFile(file);
        } catch (error) {
          console.error("Error uploading file:", error);
          alert("Error uploading file. Please try again.");
        }
      }

      async function uploadFile(file) {
        const uploadId = crypto.randomUUID(); // Unique ID for this upload session
        const CHUNK_SIZE = 1024 * 1024 * 2; // 1MB chunks
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

        for (let i = 0; i < totalChunks; i++) {
          const start = i * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, file.size);
          const chunk = file.slice(start, end);
          console.log(`Uploading chunk ${i + 1} of ${totalChunks}...`);

          // 2. Send the chunk as a raw binary payload
          const response = await fetch(
            `/api/file-upload/upload/${uploadId}/chunk/${i}`,
            {
              method: "POST",
              body: chunk,
              headers: {
                "Content-Type": "application/octet-stream",
                "x-total-chunks": totalChunks,
                "x-file-name": encodeURIComponent(file.name),
              },
            },
          );

          if (!response.ok) {
            throw new Error(`Failed to upload chunk ${i + 1}`);
          }
          const result = await response.json();
          if (result.completed) {
            console.log("File fully uploaded and merged successfully!");
            updateProgressBar(100); // Update progress bar to 100% after all chunks are uploaded
            alert("File uploaded successfully!");
            return; // Exit the loop if the file is fully uploaded and merged
          }

          // Update progress after each chunk
          const percentage = Math.round(((i + 1) / totalChunks) * 100); // Calculate percentage based on completed chunks
          updateProgressBar(percentage); // Update progress bar to 100% after all chunks are uploaded
          await wait(1000); // Wait for a second before merging
        }
      }
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const updateProgressBar = (percentage) => {
        const progressBar = document.querySelector(".progress-bar");
        progressBar.style.width = `${percentage}%`;
        progressBar.textContent = `${percentage}%`;
      };
    </script>
  </body>
</html>
