<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>file upload</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        display: flex;
        height: max-content;
        flex-direction: column;
        min-height: 100vh;
        justify-items: center;
        justify-content: center;
        align-items: center;

        /* background-color: antiquewhite; */
      }
      form {
        width: min(100%, 400px);
        display: flex;
        flex-direction: column;

        /* justify-content: center; */
        padding: 32px;
        padding-top: 40px;
        gap: 16px;
        align-content: center;
        height: 400px;
        box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.15);
      }
      form input {
        border: 2px dotted black;
        padding: 8px;
        border-radius: 8px;
      }
      form button {
        padding: 8px;
        background-color: #24a0ed;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <form
      onsubmit="onSubmit.call(this, event)"
        event.preventDefault();
        uploadFile(this.file.files[0]);
      "
    >
      <h1>File Upload</h1>
      <input type="file" name="file" />
      <button type="submit">Upload</button>
    </form>

    <script>
      async function onSubmit(event) {
        event.preventDefault();
        const file = this.file.files[0];
        if (!file) {
          alert("Please select a file to upload.");
          return;
        }
        try {
          await uploadFile(file);
          alert("File uploaded successfully!");
        } catch (error) {
          console.error("Error uploading file:", error);
          alert("Error uploading file. Please try again.");
        }
      }

      async function uploadFile(file) {
        const uploadId = crypto.randomUUID(); // Unique ID for this upload session
        const CHUNK_SIZE = 1024 * 1024; // 1MB chunks
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

        for (let i = 0; i < totalChunks; i++) {
          const start = i * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, file.size);
          const chunk = file.slice(start, end);
          console.log(`Uploading chunk ${i + 1} of ${totalChunks}...`);

          // 2. Send the chunk as a raw binary payload
          const response = await fetch(`/api/file-upload/upload/${uploadId}/chunk/${i}`, {
            method: "POST",
            body: chunk,
            headers: {
              "Content-Type": "application/octet-stream",
         
              "x-total-chunks": totalChunks,
              "x-file-name":  encodeURIComponent(file.name), 
            },
          });

          if (!response.ok) {
            throw new Error(`Failed to upload chunk ${i + 1}`);
          }
          const result = await response.json();
          if (result.completed) {
            console.log("File fully uploaded and merged successfully!");
          }
        }
      }
    </script>
  </body>
</html>
